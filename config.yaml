# Video settings
video:
  width: 1080       # 480 for preview, 1080 for full
  height: 1920      # 854 for preview, 1920 for full
  fps: 60          # 30 for preview, 60 for full

# Simulation settings
simulation:
  entity_count: 36  # 4 for test, 64 for real
  seed: 40         # Same seed = same result (remove for random)
  elimination_interval: 30
  sudden_death:
    enabled: true
    threshold_1: 10
    multiplier_1: 2
    threshold_2: 5
    multiplier_2: 4

# Visual settings
visuals:
  # Gradient background
  gradient_enabled: true
  animated_gradient: true
  gradient_top: "#1e1e2e"
  gradient_bottom: "#0a0a12"
  gradient_top_end: "#2e1a3e"
  gradient_bottom_end: "#0a1a1f"
  gradient_cycle_speed: 2.0

  # Vignette
  vignette_enabled: true
  vignette_strength: 0.4

  # Entity cards
  corner_radius: 12
  shadow_enabled: true
  shadow_blur: 10
  shadow_opacity: 100
  cell_padding: 10

  # Idle animation (wave/breathing)
  idle_enabled: true
  idle_wave_speed: 0.08
  idle_wave_amount: 4.0
  idle_breathe_speed: 0.04
  idle_breathe_amount: 0.03

  # Counter
  show_counter: true
  counter_position: top
  counter_format: "{count}"  # Just number, no "remaining"

  # Special modes (pick one or none)
  greenscreen: false
  transparent: false

# Audio settings
audio:
  enabled: true
  mode: beat_sync              # "default" or "beat_sync"
  music_path: sounds/music/vem_vem.mp3  # Your music file
  beats_file: beats/vem_vem_new.txt
  beats_fps: 60
  sound_pack: default
  countdown_enabled: false
  countdown_thresholds: [10, 5, 3]
  volume:
    elimination: 0.8
    countdown: 1.0
    winner: 1.0
    music: 0.4

# Output settings
output:
  directory: output
