# ============================================
# SURVIVAL COUNTDOWN - CONFIG WITH SLOT MACHINE SPOTLIGHT
# ============================================

video:
  width: 480 #480
  height: 854 #854
  fps: 30

simulation:
  entity_count: 25
  entity_ids: [
    "us", "id", "br", "mx", "vn",
    "ph", "ru", "th", "pk", "gb",
    "fr", "de", "jp", "it", "sa",
    "eg", "es", "pl", "my", "co",
    "kr", "ar", "tr", "in", "gr"
  ]

  elimination_mode: manual
  elimination_order: [
    "pl", "co", "my", "eg", "sa",
    "it", "es", "kr", "ar", "vn",
    "th", "de", "fr", "gb", "jp",
    "mx", "ph", "pk", "ru", "br",
    "id", "us", "gr", "in", "tr"
  ]
  use_names_for_elimination: false

  seed: 40
  elimination_interval: 30

  sudden_death:
    enabled: true
    threshold_1: 10
    multiplier_1: 2
    threshold_2: 5
    multiplier_2: 4

visuals:
  gradient_enabled: true
  animated_gradient: true
  gradient_top: "#1e1e2e"
  gradient_bottom: "#0a0a12"
  gradient_top_end: "#2e1a3e"
  gradient_bottom_end: "#0a1a1f"
  gradient_cycle_speed: 2.0
  vignette_enabled: true
  vignette_strength: 0.4
  corner_radius: 12
  shadow_enabled: true
  shadow_blur: 10
  shadow_opacity: 100
  cell_padding: 10
  idle_enabled: true
  idle_wave_speed: 0.08
  idle_wave_amount: 4.0
  idle_breathe_speed: 0.04
  idle_breathe_amount: 0.03
  show_counter: true
  counter_position: top
  counter_format: "{count}"
  greenscreen: false
  transparent: false

# Spotlight - slot machine style
spotlight:
  enabled: true

  visual:
    dim_opacity: 0.5          # Dimmer to make spotlight pop more
    active_scale: 1.12        # Bigger pop when spotlit
    locked_scale: 1.15        # Even bigger when locked
    glow_enabled: true        # Now draws border, not blob
    glow_radius: 15           # Not used anymore (border instead)
    glow_color: "#FFFFFF"     # White border (cleaner than gold)
    glow_opacity: 255

  sound:
    enabled: false

  phases:
    # CHAOS: Fast scan, ~half rotation
    chaos:
      until_remaining_percent: 60
      decoy_count: [3, 6]           # Ignored now (generator calculates)
      frames_per_stop: [2, 3]       # Very fast
      lock_frames: 3

    # GRIND: Full rotation + extra
    grind:
      until_remaining_percent: 20
      decoy_count: [5, 10]          # Ignored
      frames_per_stop: [3, 6]       # Medium speed
      lock_frames: 5

    # DUEL: Multiple rotations, dramatic slowdown
    duel:
      until_remaining_percent: 0
      decoy_count: [10, 20]         # Ignored
      frames_per_stop: [4, 10]      # Slow, decelerates
      lock_frames: 8

# Audio - elimination sounds only
audio:
  enabled: true
  mode: default
  sound_pack: default
  countdown_enabled: false
  volume:
    elimination: 0.8
    countdown: 1.0
    winner: 1.0
    music: 0.0

output:
  directory: output
