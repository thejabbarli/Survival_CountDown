# Video settings
video:
  width: 1080
  height: 1920
  fps: 60

# Simulation settings
simulation:
  entity_count: 16  # Use "all" for all entities in project
  elimination_interval: 30  # frames between eliminations
  sudden_death:
    enabled: true
    threshold_1: 10
    multiplier_1: 2
    threshold_2: 5
    multiplier_2: 4

# Visual settings
visuals:
  background_color: "#1a1a2e"
  cell_padding: 10
  show_counter: true
  counter_position: top  # top or bottom

# Output settings
output:
  directory: output
  filename_pattern: "{project}_{timestamp}"
